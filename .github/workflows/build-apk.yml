name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: |
          unzip -o BuscaBarato-Android.zip || unzip -o BuscaBarato-Android-APK.zip || true
          mv BuscaBarato/* . 2>/dev/null || true
          rm -f BuscaBarato-Android.zip BuscaBarato-Android-APK.zip
          ls -la
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BuscaBarato-APK
          path: app/build/outputs/apk/debug/app-debug.apk
